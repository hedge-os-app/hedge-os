name: Refresh TASE/EU quotes
on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    paths:
      - 'scripts/fetch-quotes.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch quotes
        run: node scripts/fetch-quotes.mjs
      - name: Fetch ESEF filings
        run: node scripts/fetch-esef.mjs
      - name: Commit data/quotes.json
        run: |
          git config user.name "hedge-os-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/quotes.json data/fx.json data/esef.json
          git diff --cached --quiet || git commit -m "chore: refresh quotes snapshot"
          git push
